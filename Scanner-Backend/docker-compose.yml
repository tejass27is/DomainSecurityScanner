services:
  postgres:
    image: postgres:16-alpine
    container_name: scanner-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "54322:5432" # 🌐 Public access on 54322
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - scanner-network

  redis:
    image: redis:7-alpine
    container_name: scanner-redis
    #    command: redis-server --requirepass ${REDIS_PASSWORD}   # 🔐 MUST for public
    ports:
      - "6379:6379" # 🌐 Public access
    networks:
      - scanner-network

  backend:
    build: .
    container_name: scanner-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - QUTTERA_API_KEY=${QUTTERA_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - QUTTERA_BASE_URL=${QUTTERA_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TIMEOUT_SECONDS=${SMTP_TIMEOUT_SECONDS:-20}
      - "EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Domain Scanner}"
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - MARKETING_EMAIL=${MARKETING_EMAIL}
      - MARKETING_PASSWORD=${MARKETING_PASSWORD}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED}
      - DOMAIN_EMAIL_VALIDATION_ENABLED=${DOMAIN_EMAIL_VALIDATION_ENABLED}
      - OTP_EXPIRY_MINUTES=${OTP_EXPIRY_MINUTES:-10}
      - LOGIN_OTP_EXPIRY_SECONDS=${LOGIN_OTP_EXPIRY_SECONDS:-120}
      - LOGIN_OTP_RESEND_WINDOW_SECONDS=${LOGIN_OTP_RESEND_WINDOW_SECONDS:-1200}
      - LOGIN_OTP_RESEND_LIMIT=${LOGIN_OTP_RESEND_LIMIT:-5}
      - LOGIN_OTP_COOLDOWN_SECONDS=${LOGIN_OTP_COOLDOWN_SECONDS:-600}
      - VERIFICATION_EXPIRY_HOURS=${VERIFICATION_EXPIRY_HOURS:-48}
      - FAILED_LOGIN_ATTEMPTS=${FAILED_LOGIN_ATTEMPTS:-5}
      - FAILED_LOGIN_WINDOW_MINUTES=${FAILED_LOGIN_WINDOW_MINUTES:-10}
      - LOCKOUT_DURATION_MINUTES=${LOCKOUT_DURATION_MINUTES:-30}
      - PUBLIC_EMAIL_DOMAINS=${PUBLIC_EMAIL_DOMAINS}
      - VAPT_MAX_FILE_SIZE_MB=${VAPT_MAX_FILE_SIZE_MB:-25}
    volumes:
      - .:/app
    depends_on:
      - postgres
      - redis
    networks:
      - scanner-network

networks:
  scanner-network:
    external: true

volumes:
  postgres_data:
