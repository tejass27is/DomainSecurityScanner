services:
  postgres:
    image: postgres:16-alpine
    container_name: scanner-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scanner-network

  redis:
    image: redis:7-alpine
    container_name: scanner-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - scanner-network

  backend:
    build: .
    container_name: scanner-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - QUTTERA_API_KEY=${QUTTERA_API_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?WEBHOOK_SECRET is required}
      - REDIS_PASSWORD=${REDIS_PASSWORD:?REDIS_PASSWORD is required}
      - PUBLIC_USER_PASSWORD=${PUBLIC_USER_PASSWORD:?PUBLIC_USER_PASSWORD is required}
      - ABUSEIPDB_API_KEY=${ABUSEIPDB_API_KEY}
      - QUTTERA_BASE_URL=${QUTTERA_BASE_URL}
      - FRONTEND_URL=${FRONTEND_URL}
      - SMTP_SERVER=${SMTP_SERVER}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_TIMEOUT_SECONDS=${SMTP_TIMEOUT_SECONDS:-20}
      - "EMAIL_FROM_NAME=${EMAIL_FROM_NAME:-Domain Scanner}"
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SOC_EMAIL=${SOC_EMAIL:-}
      - SOC_PASSWORD=${SOC_PASSWORD:-}
      - MARKETING_EMAIL=${MARKETING_EMAIL}
      - MARKETING_PASSWORD=${MARKETING_PASSWORD}
      - RECAPTCHA_SECRET_KEY=${RECAPTCHA_SECRET_KEY}
      - RECAPTCHA_ENABLED=${RECAPTCHA_ENABLED}
      - ADMIN_TOTP_REQUIRED=${ADMIN_TOTP_REQUIRED:-false}
      - DOMAIN_EMAIL_VALIDATION_ENABLED=${DOMAIN_EMAIL_VALIDATION_ENABLED}
      - OTP_EXPIRY_MINUTES=${OTP_EXPIRY_MINUTES:-10}
      - LOGIN_OTP_EXPIRY_SECONDS=${LOGIN_OTP_EXPIRY_SECONDS:-120}
      - LOGIN_OTP_RESEND_WINDOW_SECONDS=${LOGIN_OTP_RESEND_WINDOW_SECONDS:-1200}
      - LOGIN_OTP_RESEND_LIMIT=${LOGIN_OTP_RESEND_LIMIT:-5}
      - LOGIN_OTP_COOLDOWN_SECONDS=${LOGIN_OTP_COOLDOWN_SECONDS:-600}
      - VERIFICATION_EXPIRY_HOURS=${VERIFICATION_EXPIRY_HOURS:-48}
      - FAILED_LOGIN_ATTEMPTS=${FAILED_LOGIN_ATTEMPTS:-5}
      - FAILED_LOGIN_WINDOW_MINUTES=${FAILED_LOGIN_WINDOW_MINUTES:-10}
      - LOCKOUT_DURATION_MINUTES=${LOCKOUT_DURATION_MINUTES:-30}
      - PUBLIC_EMAIL_DOMAINS=${PUBLIC_EMAIL_DOMAINS}
      - VAPT_MAX_FILE_SIZE_MB=${VAPT_MAX_FILE_SIZE_MB:-25}
      # Either name works; the bare console address is fine (".../api/v1" is
      # appended automatically). ACUNETIX_URL takes precedence.
      - ACUNETIX_URL=${ACUNETIX_URL:-}
      - ACUNETIX_BASE_URL=${ACUNETIX_BASE_URL:-}
      - ACUNETIX_API_KEY=${ACUNETIX_API_KEY:-}
      - ACUNETIX_PROFILE_ID=${ACUNETIX_PROFILE_ID:-}
      - ACUNETIX_VERIFY_TLS=${ACUNETIX_VERIFY_TLS:-false}
      - ACUNETIX_POLL_INTERVAL_SEC=${ACUNETIX_POLL_INTERVAL_SEC:-20}
      - ACUNETIX_MAX_WAIT_SEC=${ACUNETIX_MAX_WAIT_SEC:-43200}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - HOST=${HOST:-0.0.0.0}
      - PORT=${PORT:-8000}
      - RELOAD=${RELOAD:-false}
      # Checklist attachments live on a named volume, so they survive a rebuild
      # and are never lost when the container is recreated.
      - VAPT_ATTACHMENT_DIR=${VAPT_ATTACHMENT_DIR:-/app/storage/vapt-attachments}
    volumes:
      - vapt_attachments:/app/storage/vapt-attachments
    healthcheck:
      test: ["CMD", "python", "-c", "import os, urllib.request; urllib.request.urlopen('http://localhost:%s/health' % os.getenv('PORT', '8000'), timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - postgres
      - redis
    networks:
      - scanner-network

networks:
  scanner-network:
    external: true

volumes:
  postgres_data:
  vapt_attachments:
