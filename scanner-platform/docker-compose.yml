services:
  worker-main:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanner-worker-main
    networks:
      - scanner-network
    environment:
      - WORKER_TYPE=main
      - REDIS_ADDR=redis:6379
      - BACKEND_URL=http://backend:8000
    deploy:
      replicas: 1

  worker-fix:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: scanner-worker-fix
    networks:
      - scanner-network
    environment:
      - WORKER_TYPE=fix
      - REDIS_ADDR=redis:6379
      - BACKEND_URL=http://backend:8000
    deploy:
      replicas: 1

networks:
  scanner-network:
    external: true