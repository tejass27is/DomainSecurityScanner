name: Deploy Frontend (Static)

on:
  push:
    branches:
      - main
    paths:
      - 'ShieldStat-Frontend/**'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout
        uses: actions/checkout@v6

      # 2️⃣ Setup Node
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      # 3️⃣ Install dependencies
      - name: Install dependencies
        working-directory: ShieldStat-Frontend
        run: npm ci

      - name: Lint frontend
        working-directory: ShieldStat-Frontend
        run: npm run lint

      - name: Test frontend
        working-directory: ShieldStat-Frontend
        run: npm test

      # 4. Build Vite frontend
      - name: Build frontend
        working-directory: ShieldStat-Frontend
        run: |
          test -n "${{ secrets.VITE_BACKEND_URL }}"
          VITE_BACKEND_URL="${{ secrets.VITE_BACKEND_URL }}" npm run build

      # Upload to a staging directory first so a failed upload cannot erase live files.
      - name: Clean old files on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            rm -rf /var/www/scanner-frontend-staging
            mkdir -p /var/www/scanner-frontend-staging

          # 6. Upload Vite output
      - name: Upload build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          source: "ShieldStat-Frontend/dist/*"
          target: "/var/www/scanner-frontend-staging/"

      # 7️⃣ Fix permissions + reload nginx
      - name: Finalize deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            test -f /var/www/scanner-frontend-staging/index.html
            rm -rf /var/www/scanner-frontend-old
            if [ -d /var/www/scanner-frontend ]; then mv /var/www/scanner-frontend /var/www/scanner-frontend-old; fi
            mv /var/www/scanner-frontend-staging /var/www/scanner-frontend
            rm -rf /var/www/scanner-frontend-old
            chown -R www-data:www-data /var/www/scanner-frontend

            echo "Reloading Nginx..."
            systemctl reload nginx
